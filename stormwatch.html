<script>
let operation;
StormwatchHub.mount({
 exit:()=>location.assign('index.html'),
 clearMission(){operation?.close();operation=null},
 deploy(settings,back){
  operation=Stormwatch.mount({...settings,hub:true,leave(){operation.close();operation=null;back()}});
 }
});
</script>
